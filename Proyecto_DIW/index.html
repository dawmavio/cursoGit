<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen DIW</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
<section id="formulario">
<form>

<fieldset>
<legend>Datos personales</legend>

<label for="nombre">Nombre</label>
<input type="text" id="nombre" name="nombre" maxlength="15" pattern="[A-Za-z0-9 ]+" required placeholder="Nombre">

<label for="apellidos">Apellidos</label>
<input type="text" id="apellidos" name="apellidos" maxlength="15" pattern="[A-Za-z0-9 ]+" required placeholder="Apellidos">

<label for="direccion">Dirección</label>
<input type="text" id="direccion" name="direccion" maxlength="15" pattern="[A-Za-z0-9 ]+" required placeholder="Dirección">

<label for="ciudad">Ciudad</label>
<input type="text" id="ciudad" name="ciudad" maxlength="15" pattern="[A-Za-z0-9 ]+" required placeholder="Ciudad">

<label for="provincia">Provincia</label>
<input type="text" id="provincia" name="provincia" maxlength="15" pattern="[A-Za-z0-9 ]+" required placeholder="Provincia">

<label for="nif">NIF</label>
<input type="text" id="nif" name="nif" minlength="9" maxlength="9" required placeholder="12345678A">

<label for="email">Correo electrónico</label>
<input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">

<label for="fecha">Fecha</label>
<input type="date" id="fecha" name="fecha" required>

<label for="edad">Edad</label>
<input type="number" id="edad" name="edad" min="18" max="99" required placeholder="Edad">

<label for="info">Información adicional</label>
<textarea id="info" name="info" placeholder="Opcional"></textarea>

<button type="submit">Enviar</button>

</fieldset>

</form>
</section>
</main>

</body>
</html>
